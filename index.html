<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#263a30"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="将棋定跡">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://api.github.com; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<title>将棋定跡研究室｜Stage18-1D</title><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-192.png"><link rel="stylesheet" href="./style.css"></head>
<body><main id="app">
<header><div><small>盤上研究室 · Stage18-1D 暫定版</small><h1>将棋定跡研究室</h1></div><button id="menu" aria-label="データと設定を開く">保存・設定</button></header>
<div class="status"><span id="offline">オフライン準備中</span><span id="saved" role="status">起動中…</span></div>
<div id="notice" role="alert" hidden></div>
<label class="opening">定跡<select id="opening" disabled></select></label>
<div class="board-options"><button type="button" id="boardStyle" aria-label="駒形表示" aria-pressed="false">駒表示へ</button><div id="turn" class="turn"></div></div>
<div id="playArea" class="play-area">
<section id="topHand" class="hand" aria-label="上側の持ち駒"></section>
<div id="files" class="files"></div>
<div class="board-wrap"><div id="board" class="board" role="group" aria-label="将棋盤"></div></div>
<section id="bottomHand" class="hand" aria-label="下側の持ち駒"></section>
<svg id="arrows" aria-hidden="true"><defs><pattern id="bad-arrow-stripes" patternUnits="userSpaceOnUse" width="15" height="1"><rect x="10" width="5" height="1" fill="rgba(40,88,180,0.08)"/><rect width="10" height="1" fill="rgba(40,88,180,0.48)"/></pattern></defs><g id="arrowLines"></g></svg>
</div>
<section class="candidates" aria-label="候補手"><div id="candidates"></div></section>
<section class="position-notes" aria-label="局面のコメントと評価値">
<button type="button" id="comment" class="comment-box" aria-label="局面コメントを編集"><span id="commentText" class="comment-text"></span></button>
<button type="button" id="editEval" class="evaluation-box" aria-label="局面評価値を編集"><span class="evaluation-label">評価値</span><span id="eval" class="evaluation-value">未設定</span></button>
</section>
<nav class="tools" aria-label="局面の閲覧と操作"><button id="back" disabled>◀ 戻る</button><button id="forward" disabled>進む ▶</button><button id="flip">反転</button><button id="root">初期盤面</button><button id="attributes">属性</button><button id="graph" aria-label="定跡全体図">全体図</button></nav>
<p class="hint" id="hint">駒をタップして移動先を選びます。入力は端末に自動保存されます。</p>
</main><dialog id="dialog"><div id="dialogBody"></div><button id="closeDialog" class="close">閉じる</button></dialog><input id="importFile" type="file" accept=".json,application/json" hidden><script type="module" src="./app.js"></script></body></html>
