<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111416"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="将棋定跡">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://api.github.com; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<title>将棋定跡研究室｜Stage18-1T</title><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-192.png"><link rel="stylesheet" href="./style.css"></head>
<body><main id="app">
<header><div><small>盤上研究室 · Stage18-1T 暫定版</small><h1>将棋定跡研究室</h1></div><button id="menu" aria-label="データと設定を開く">保存・設定</button></header>
<div class="status"><span id="offline">オフライン準備中</span><span id="saved" role="status">起動中…</span></div>
<div id="notice" role="alert" hidden></div>
<label class="opening">定跡<select id="opening" disabled></select></label>
<div class="board-options"><div class="board-display-controls"><button type="button" id="boardStyle" aria-label="駒形表示" aria-pressed="false"><span>駒</span><span>表示へ</span></button><button type="button" id="flip" aria-label="盤面を反転">反転</button><button type="button" id="arrowToggle" aria-label="矢印：両者ON。タップで先手ON"><span>矢印</span><span>両者ON</span></button><button type="button" id="graph" aria-label="定跡全体図"><span>定跡</span><span>全体</span></button></div><div id="turn" class="turn"></div></div>
<div id="playArea" class="play-area">
<section id="topHand" class="hand" aria-label="上側の持ち駒"></section>
<div class="board-wrap"><div id="board" class="board" role="group" aria-label="将棋盤"></div></div>
<section id="bottomHand" class="hand" aria-label="下側の持ち駒"></section>
<svg id="arrows" aria-hidden="true"><defs><pattern id="bad-arrow-stripes" patternUnits="userSpaceOnUse" width="15" height="1"><rect x="10" width="5" height="1" fill="rgba(40,88,180,0.08)"/><rect width="10" height="1" fill="rgba(40,88,180,0.48)"/></pattern></defs><g id="arrowLines"></g></svg>
</div>
<nav class="tools" aria-label="局面の閲覧と操作">
<button type="button" id="back" aria-label="履歴を戻る" disabled><span aria-hidden="true">◀︎</span><span>戻る</span></button>
<button type="button" id="forward" aria-label="履歴を進む" disabled><span aria-hidden="true">▶︎</span><span>進む</span></button>
<button type="button" id="root" aria-label="初期盤面"><span>初期</span><span>盤面</span></button>
<button type="button" id="attributes" aria-label="指し手属性を編集"><span>指し手</span><span>属性</span></button>
<button type="button" id="editEval" class="evaluation-box" aria-label="局面評価値を編集"><span id="evalLabel" class="evaluation-label">未評価</span><span id="eval" class="evaluation-value">未設定</span></button>
</nav>
<section class="position-notes" aria-label="候補手と局面コメント">
<div id="candidates" class="candidates" aria-label="候補手"></div>
<button type="button" id="comment" class="comment-box" aria-label="局面コメントを編集"><span id="commentText" class="comment-text"></span></button>
</section>
<p class="hint" id="hint">駒をタップして移動先を選びます。入力は端末に自動保存されます。</p>
</main><dialog id="dialog"><div id="dialogBody"></div><button id="closeDialog" class="close">閉じる</button></dialog><input id="importFile" type="file" accept=".json,application/json" hidden><script type="module" src="./app.js"></script></body></html>
